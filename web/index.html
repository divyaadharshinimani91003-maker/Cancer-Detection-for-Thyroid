<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThyroCheck AI</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#5b6475; --accent:#2457d6; --line:#e3e6ec; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:16px; }
  img { width:100%; border-radius:8px; background:#000; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .label { font-size:1.4rem; font-weight:700; text-transform:uppercase; }
  .malignant { color:#c01c28 } .benign { color:#1a7f37 } .normal { color:#1f4e79 }
  .bar { height:10px; background:var(--accent); border-radius:5px; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:.9rem; }
  .row span:first-child { width:80px; }
  .row .track { flex:1; background:var(--line); border-radius:5px; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ThyroCheck AI</h1>
  <p class="sub">Thyroid nodule classification from ultrasound · FibonacciNet + Grad-CAM · research prototype</p>

  <div class="card">
    <input type="file" id="file" accept="image/*">
    <button id="go" disabled>Analyse</button>
    <button id="report" disabled>Download report</button>
    <small id="status"></small>
  </div>

  <div class="grid" id="results" hidden>
    <div class="card"><b>Input</b><img id="inp" alt="input ultrasound"></div>
    <div class="card"><b>Grad-CAM</b><img id="cam" alt="Grad-CAM heatmap"></div>
    <div class="card">
      <div>Prediction</div>
      <div class="label" id="label"></div>
      <div id="conf"></div>
      <p id="interp"></p>
      <div id="probs"></div>
    </div>
  </div>
  <small>Not a medical device. Findings must be confirmed by a qualified clinician.</small>
</main>
<script>
  const API = window.location.origin;           // same origin as FastAPI
  const $ = (id) => document.getElementById(id);
  let file = null;

  $("file").onchange = (e) => {
    file = e.target.files[0];
    $("go").disabled = $("report").disabled = !file;
    if (file) $("inp").src = URL.createObjectURL(file);
  };

  $("go").onclick = async () => {
    $("status").textContent = "Analysing…";
    const fd = new FormData(); fd.append("file", file);
    try {
      const r = await fetch(`${API}/predict`, { method: "POST", body: fd });
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const d = await r.json();
      $("results").hidden = false;
      $("cam").src = "data:image/png;base64," + d.gradcam_png_base64;
      $("label").textContent = d.label; $("label").className = "label " + d.label;
      $("conf").textContent = `Confidence ${(d.confidence * 100).toFixed(1)}%`;
      $("interp").textContent = d.interpretation;
      $("probs").innerHTML = Object.entries(d.probabilities).map(([k, v]) =>
        `<div class="row"><span>${k}</span><div class="track"><div class="bar" style="width:${(v*100).toFixed(1)}%"></div></div><span>${(v*100).toFixed(1)}%</span></div>`).join("");
      $("status").textContent = "";
    } catch (err) { $("status").textContent = "Error: " + err.message; }
  };

  $("report").onclick = async () => {
    $("status").textContent = "Building report…";
    const fd = new FormData(); fd.append("file", file);
    const r = await fetch(`${API}/report`, { method: "POST", body: fd });
    if (!r.ok) { $("status").textContent = "Report failed"; return; }
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "thyrocheck_report.docx"; a.click();
    $("status").textContent = "";
  };
</script>
</body>
</html>
