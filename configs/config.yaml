# ThyroCheck AI - central configuration
# Every script reads this file. Override any value on the command line with
#   --set key.subkey=value   (e.g. --set train.epochs=40)

project:
  name: ThyroCheck AI
  seed: 42

data:
  # Kaggle dataset: TN5000 (5,000 biopsy-confirmed thyroid nodule ultrasound images, VOC layout)
  # To go back to AUITD use:
  #   kaggle_dataset: azouzmaroua/algeria-ultrasound-images-thyroid-dataset-auitd
  #   raw_dir: data/raw/auitd, label_source: folder, classes: [benign, malignant, normal]
  kaggle_dataset: abdullahelafifi/main-data
  raw_dir: data/raw/tn5000     # Kaggle files land here
  processed_dir: data/processed
  splits_csv: data/processed/splits.csv
  # Which classes to train on. TN5000 has benign / malignant (AUITD also has normal).
  classes: [benign, malignant]
  # How labels are read:
  #   folder  - search each file's folder path for label_keywords (AUITD)
  #   voc_xml - read <object><name> from Annotations/<image>.xml and map it with voc_label_map (TN5000)
  label_source: voc_xml
  voc_label_map: {"0": benign, "1": malignant}
  # voc_xml only: train on the annotated nodule (ROI) instead of the whole scan.
  # Crops are square, with crop_margin x box size of context on each side.
  # NOTE: a model trained on crops expects a nodule crop at inference time too.
  crop_to_bbox: true
  crop_margin: 0.15
  # A file's class is found by searching its folder path for these keywords
  # (case-insensitive). Add synonyms here if the Kaggle folders are named differently.
  label_keywords:
    benign: [benign, benin, "bénin", begnin]
    malignant: [malignant, malin, malignent, cancer]
    normal: [normal, healthy]
  image_extensions: [.png, .jpg, .jpeg, .bmp, .tif, .tiff]
  # Stratified split: 80% train / 10% val / 10% test (the FibonacciNet paper uses 60/20/20)
  val_size: 0.1
  test_size: 0.1
  deduplicate: true            # drop byte-identical images before splitting (prevents leakage)

model:
  name: fibonacci_net
  input_size: 224
  channels: 3
  # Filters follow the Fibonacci series. The last two blocks use depthwise
  # separable convs. Use 6 blocks (drop 377) for small datasets.
  filters: [21, 34, 55, 89, 144, 233, 377]
  dwsc_last_n: 2
  use_pcb_2_4: true            # parallel concat block 2 -> 4 (Avg-2Max pooling)
  use_pcb_3_5: true            # parallel concat block 3 -> 5 (conv + Avg-2Max pooling)
  pcb_3_5_filters: 24
  pool_blocks: 5               # max-pool after the first 5 blocks -> 7x7x377 final feature map
  convs_per_block: 1           # raise to 2 for a higher-capacity variant
  bn_momentum: 0.9             # lower than Keras' 0.99 so BN stats settle on small datasets
  dropout: 0.3

train:
  batch_size: 8
  epochs: 25
  learning_rate: 1.0e-4
  # Paper's adaptive LR: constant for the first N epochs, then multiply by decay each epoch
  lr_constant_epochs: 13
  lr_decay: 0.9
  augment: false               # the paper trains without augmentation; set true to experiment
  class_weights: false         # "balanced" class weights for imbalance experiments
  monitor: val_loss            # checkpoint metric: val_loss | val_accuracy | val_auc
  early_stopping_patience: 0   # 0 = off (paper does not use early stopping)
  output_dir: outputs
  model_path: outputs/models/fibonacci_net.keras

xai:
  target_layer: last_conv      # name of the layer Grad-CAM reads from
  alpha: 0.4                   # heatmap overlay opacity

report:
  output_dir: outputs/reports
  institution: "ThyroCheck AI - Research Prototype"
  disclaimer: >-
    This report was generated by a research prototype and is NOT a medical
    diagnosis. Findings must be reviewed by a qualified clinician and confirmed
    by fine-needle aspiration / histopathology where indicated.

api:
  host: 0.0.0.0
  port: 8000
  api_url: http://localhost:8000   # used by the Streamlit app
